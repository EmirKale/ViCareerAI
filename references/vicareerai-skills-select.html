<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beceri Analizi Başlat — ViCareerAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0A1628; --bg-2:#0E2038;
    --grid-line:rgba(110,168,200,0.10); --grid-line-major:rgba(110,168,200,0.18);
    --cyan:#6FD6E8; --cyan-dim:rgba(111,214,232,0.55);
    --stamp:#E8543C; --stamp-dim:rgba(232,84,60,0.18);
    --purple:#A78BFA;
    --paper:rgba(223,238,245,0.04); --paper-border:rgba(111,214,232,0.16);
    --text:#EAF3F7; --text-dim:rgba(234,243,247,0.62);
    --mono-label:#8FB9CC; --radius:2px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  .grid-field{
    position:fixed;inset:-10%;
    background-image:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 40px);
    z-index:0;pointer-events:none;
  }

  .select-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .select-card{
    width:100%;max-width:540px;background:rgba(14,32,56,.6);backdrop-filter:blur(6px);
    border:1.5px dashed var(--cyan-dim);border-radius:6px;padding:clamp(32px,5vw,48px) clamp(28px,5vw,44px);
    text-align:center;
  }
  .select-card h1{font-size:clamp(22px,3vw,27px);margin-bottom:10px;}
  .select-card .sub{font-size:14px;color:var(--text-dim);max-width:400px;margin:0 auto 32px;line-height:1.55;}

  .field-block{text-align:left;margin-bottom:26px;}
  .field-block .flabel{
    display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
    letter-spacing:.06em;color:var(--text);font-weight:600;margin-bottom:10px;
  }
  .field-block .flabel svg{width:14px;height:14px;color:var(--cyan);}
  .field-block input{
    width:100%;height:48px;padding:0 14px;background:rgba(255,255,255,0.02);border:1px solid var(--paper-border);
    border-radius:var(--radius);color:var(--text);font-size:14.5px;
  }
  .field-block input:focus{outline:none;border-color:var(--cyan);background:rgba(111,214,232,0.04);}
  .field-block input::placeholder{color:rgba(234,243,247,0.3);}
  .field-block .fhint{font-size:12px;color:var(--mono-label);margin-top:9px;}

  .eyebrow-mid{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mono-label);margin-bottom:16px;}

  .cv-pick{
    display:flex;align-items:center;gap:12px;width:100%;height:54px;padding:0 18px;
    background:rgba(255,255,255,0.02);border:1px solid var(--paper-border);border-radius:var(--radius);
    color:var(--text);font-size:14.5px;font-weight:500;margin-bottom:10px;text-align:left;
  }
  .cv-pick:hover{border-color:var(--cyan-dim);background:rgba(111,214,232,.04);}
  .cv-pick svg.cv-doc{width:17px;height:17px;color:var(--cyan);flex-shrink:0;}
  .cv-pick .cv-name{flex:1;}
  .cv-pick svg.cv-go{width:15px;height:15px;color:var(--mono-label);flex-shrink:0;}

  .divider{display:flex;align-items:center;gap:14px;margin:26px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mono-label);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--paper-border);}

  .upload-btn{
    width:100%;height:50px;display:flex;align-items:center;justify-content:center;gap:10px;
    border:1px solid var(--cyan-dim);border-radius:var(--radius);background:rgba(111,214,232,.06);
    color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.02em;
  }
  .upload-btn:hover{background:rgba(111,214,232,.12);}
  .upload-btn svg{width:16px;height:16px;}
  .upload-hint{font-size:11.5px;color:var(--mono-label);margin-top:10px;font-family:'JetBrains Mono',monospace;}

  .cancel-link{display:block;margin-top:30px;font-size:13px;color:var(--cyan-dim);}
  .cancel-link:hover{color:var(--cyan);text-decoration:underline;}
</style>

</head>
<body>
<div class="grid-field"></div>
<div class="select-wrap">
  <div class="select-card">
    <h1>Beceri Analizi</h1>
    <p class="sub">Hedef pozisyonunuzu belirleyin ve yeteneklerinizi AI ile analiz edin.</p>

    <div class="field-block">
      <div class="flabel"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg> HEDEF POZİSYON (OPSİYONEL)</div>
      <input type="text" placeholder="Örn: Frontend Developer, Product Manager...">
      <div class="fhint">Belirtirseniz analiz tamamen bu role uygunluğunuz üzerinden yapılır.</div>
    </div>

    <div class="eyebrow-mid">MEVCUT CV'NİZ İLE ANALİZ EDİN</div>
    <button class="cv-pick"><svg class="cv-doc" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span class="cv-name">EMİR KALE - CV</span><svg class="cv-go" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="cv-pick"><svg class="cv-doc" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span class="cv-name">Automated Test User - CV</span><svg class="cv-go" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

    <div class="divider">VEYA</div>

    <button class="upload-btn"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Dışarıdan CV Yükle (PDF / DOCX)</button>
    <div class="upload-hint">MAKSIMUM 5MB DOSYA BOYUTU</div>

    <a class="cancel-link" href="vicareerai-skills.html">İptal Et ve Analize Dön</a>
  </div>
</div>
</body>
</html>
