<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mektup Geçmişim — ViCareerAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1628; --bg-2:#0E2038; --bg-3:#0C1C33;
    --grid-line:rgba(110,168,200,0.08);
    --cyan:#6FD6E8; --cyan-dim:rgba(111,214,232,0.55);
    --stamp:#E8543C; --stamp-dim:rgba(232,84,60,0.18);
    --green:#6FE8A8; --amber:#E8B85E; --purple:#A78BFA;
    --paper:rgba(223,238,245,0.04); --paper-border:rgba(111,214,232,0.14);
    --text:#EAF3F7; --text-dim:rgba(234,243,247,0.6);
    --mono-label:#8FB9CC; --radius:2px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--cyan-dim);color:#06121f;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  svg.icon{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6;}
  input,textarea,select{font-family:'Inter',sans-serif;}

  .grid-field{
    position:fixed;inset:0;
    background-image:repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 40px);
    z-index:0;pointer-events:none;
  }

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:rgba(10,22,40,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--paper-border);
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
  .logo-mark{width:28px;height:28px;border:1.5px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);flex-shrink:0;}
  .pro-badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--stamp);border:1px solid var(--stamp-dim);padding:2px 7px;border-radius:var(--radius);margin-left:4px;}
  .topbar-center{display:flex;gap:28px;}
  .topbar-center a{font-size:14px;color:var(--text-dim);}
  .topbar-center a:hover{color:var(--cyan);}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--paper-border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:transparent;font-family:'JetBrains Mono',monospace;font-size:11px;}
  .panel-btn{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;background:var(--cyan);color:var(--bg);padding:9px 16px;border-radius:var(--radius);border:none;}
  @media(max-width:860px){.topbar-center{display:none;}}

  /* ---------- SHELL ---------- */
  .shell-body{display:flex;position:relative;z-index:1;min-height:calc(100vh - 64px);}
  .sidebar{width:248px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--paper-border);padding:24px 14px;display:flex;flex-direction:column;}
  .sidebar-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mono-label);padding:0 12px;margin-bottom:14px;}
  .nav-list{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius);color:var(--text-dim);font-size:14px;position:relative;border-left:2px solid transparent;}
  .nav-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .nav-item.active{color:var(--text);background:rgba(111,214,232,0.06);border-left:2px solid var(--stamp);font-weight:500;}
  .nav-item.disabled{opacity:.45;cursor:default;}
  .nav-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:var(--radius);margin-left:auto;}
  .nav-badge.new{color:var(--cyan);border:1px solid var(--cyan-dim);}
  .nav-badge.soon{color:var(--stamp);border:1px solid var(--stamp-dim);}
  .sidebar-foot{border-top:1px solid var(--paper-border);padding-top:14px;margin-top:10px;}
  .logout{display:flex;align-items:center;gap:12px;padding:11px 12px;color:var(--stamp);font-size:14px;}
  @media(max-width:900px){.sidebar{display:none;}}

  .main{flex:1;padding:36px clamp(20px,4vw,44px) 60px;max-width:1320px;}

  /* ---------- SHARED BP CARD (corner-bracket) ---------- */
  .bp-card{position:relative;background:var(--paper);border:1px solid var(--paper-border);border-radius:var(--radius);padding:26px;}
  .bp-card svg.corners{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .bp-card svg.corners path{stroke:var(--cyan);stroke-width:1.3;fill:none;}
  .corners-html{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}

  .page-head{margin-bottom:28px;}
  .page-head .peyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--mono-label);margin-bottom:8px;}
  .page-head h1{font-size:clamp(22px,3vw,28px);margin-bottom:8px;}
  .page-head p{color:var(--text-dim);font-size:14px;max-width:560px;}

  .btn-stamp{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.03em;background:var(--stamp);color:var(--bg);padding:11px 18px;border-radius:var(--radius);border:none;}
  .btn-outline{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.03em;background:transparent;color:var(--text);padding:11px 18px;border-radius:var(--radius);border:1px solid var(--paper-border);}
  .btn-outline:hover{border-color:var(--cyan-dim);}
  .btn-ai{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--purple);border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.06);padding:9px 15px;border-radius:var(--radius);border-style:solid;}
</head>

    </nav>
    <div class="sidebar-foot">
      <a class="nav-item " href="vicareerai-account.html">

<style>
  .list-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:32px;}
  .item-card{position:relative;background:var(--paper);border:1px solid var(--paper-border);border-radius:var(--radius);padding:22px;max-width:420px;}
  .item-card svg.corners{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .item-card svg.corners path{stroke:var(--cyan);stroke-width:1.3;fill:none;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .item-icon{width:38px;height:38px;border-radius:var(--radius);background:rgba(111,214,232,.08);display:flex;align-items:center;justify-content:center;color:var(--cyan);flex-shrink:0;}
  .item-actions{display:flex;gap:6px;}
  .item-actions button{width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--paper-border);background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;}
  .item-actions button:hover{border-color:var(--cyan-dim);color:var(--cyan);}
  .item-actions button.danger:hover{border-color:var(--stamp);color:var(--stamp);}
  .item-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--cyan);border:1px solid var(--cyan-dim);padding:2px 7px;border-radius:var(--radius);margin-left:10px;}
  .item-title{font-size:15.5px;font-weight:500;margin-bottom:8px;}
  .item-date{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mono-label);}
  .item-edit-btn{
    width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid var(--paper-border);
    padding:11px;border-radius:var(--radius);color:var(--text);
  }
  .item-edit-btn:hover{border-color:var(--cyan-dim);}
  .empty-hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mono-label);margin-top:40px;}
</style>
