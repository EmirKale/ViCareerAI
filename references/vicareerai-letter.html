<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivasyon Mektubu — ViCareerAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1628; --bg-2:#0E2038; --bg-3:#0C1C33;
    --grid-line:rgba(110,168,200,0.08);
    --cyan:#6FD6E8; --cyan-dim:rgba(111,214,232,0.55);
    --stamp:#E8543C; --stamp-dim:rgba(232,84,60,0.18);
    --green:#6FE8A8; --amber:#E8B85E; --purple:#A78BFA;
    --paper:rgba(223,238,245,0.04); --paper-border:rgba(111,214,232,0.14);
    --text:#EAF3F7; --text-dim:rgba(234,243,247,0.6);
    --mono-label:#8FB9CC; --radius:2px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--cyan-dim);color:#06121f;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  svg.icon{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6;}
  input,textarea,select{font-family:'Inter',sans-serif;}

  .grid-field{
    position:fixed;inset:0;
    background-image:repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 40px);
    z-index:0;pointer-events:none;
  }

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:rgba(10,22,40,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--paper-border);
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
  .logo-mark{width:28px;height:28px;border:1.5px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);flex-shrink:0;}
  .pro-badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--stamp);border:1px solid var(--stamp-dim);padding:2px 7px;border-radius:var(--radius);margin-left:4px;}
  .topbar-center{display:flex;gap:28px;}
  .topbar-center a{font-size:14px;color:var(--text-dim);}
  .topbar-center a:hover{color:var(--cyan);}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--paper-border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:transparent;font-family:'JetBrains Mono',monospace;font-size:11px;}
  .panel-btn{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;background:var(--cyan);color:var(--bg);padding:9px 16px;border-radius:var(--radius);border:none;}
  @media(max-width:860px){.topbar-center{display:none;}}

  /* ---------- SHELL ---------- */
  .shell-body{display:flex;position:relative;z-index:1;min-height:calc(100vh - 64px);}
  .sidebar{width:248px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--paper-border);padding:24px 14px;display:flex;flex-direction:column;}
  .sidebar-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mono-label);padding:0 12px;margin-bottom:14px;}
  .nav-list{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius);color:var(--text-dim);font-size:14px;position:relative;border-left:2px solid transparent;}
  .nav-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .nav-item.active{color:var(--text);background:rgba(111,214,232,0.06);border-left:2px solid var(--stamp);font-weight:500;}
  .nav-item.disabled{opacity:.45;cursor:default;}
  .nav-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:var(--radius);margin-left:auto;}
  .nav-badge.new{color:var(--cyan);border:1px solid var(--cyan-dim);}
  .nav-badge.soon{color:var(--stamp);border:1px solid var(--stamp-dim);}
  .sidebar-foot{border-top:1px solid var(--paper-border);padding-top:14px;margin-top:10px;}
  .logout{display:flex;align-items:center;gap:12px;padding:11px 12px;color:var(--stamp);font-size:14px;}
  @media(max-width:900px){.sidebar{display:none;}}

  .main{flex:1;padding:36px clamp(20px,4vw,44px) 60px;max-width:1320px;}

  /* ---------- SHARED BP CARD (corner-bracket) ---------- */
  .bp-card{position:relative;background:var(--paper);border:1px solid var(--paper-border);border-radius:var(--radius);padding:26px;}
  .bp-card svg.corners{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .bp-card svg.corners path{stroke:var(--cyan);stroke-width:1.3;fill:none;}
  .corners-html{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}

  .page-head{margin-bottom:28px;}
  .page-head .peyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--mono-label);margin-bottom:8px;}
  .page-head h1{font-size:clamp(22px,3vw,28px);margin-bottom:8px;}
  .page-head p{color:var(--text-dim);font-size:14px;max-width:560px;}

  .btn-stamp{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.03em;background:var(--stamp);color:var(--bg);padding:11px 18px;border-radius:var(--radius);border:none;}
  .btn-outline{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.03em;background:transparent;color:var(--text);padding:11px 18px;border-radius:var(--radius);border:1px solid var(--paper-border);}
  .btn-outline:hover{border-color:var(--cyan-dim);}
  .btn-ai{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--purple);border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.06);padding:9px 15px;border-radius:var(--radius);border-style:solid;}
</head>
<body>

<div class="grid-field"></div>

<header class="topbar">
  <div class="logo"><span class="logo-mark">Vi</span>ViCareerAI<span class="pro-badge">PRO</span></div>
  <nav class="topbar-center">
    <a href="vicareerai-landing.html#features">Özellikler</a>
    <a href="vicareerai-pricing.html">Fiyatlandırma</a>
  </nav>
  <div class="topbar-right">
    <button class="icon-btn">TR</button>
    <button class="icon-btn">☼</button>
    <a class="panel-btn" href="vicareerai-dashboard.html">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Panelim
    </a>
  </div>
</header>

<div class="shell-body">
  <aside class="sidebar">
    <div class="sidebar-eyebrow">MENÜ</div>
    <nav class="nav-list">
      <a class="nav-item " href="vicareerai-dashboard.html">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Panelim
      </a>
      <a class="nav-item " href="vicareerai-cv-history.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        CV Geçmişim
      </a>
      <a class="nav-item active" href="vicareerai-letter-history.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 7l8 6 8-6"/></svg>
        Mektup Geçmişim
      </a>
      <a class="nav-item " href="vicareerai-discover.html">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Hemen Keşfet
      </a>
      <a class="nav-item " href="vicareerai-applications.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7h18M3 7l2-4h14l2 4M3 7v12a1 1 0 001 1h16a1 1 0 001-1V7"/></svg>
        Başvurularım
      </a>
      <a class="nav-item " href="vicareerai-interview.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4v4a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        Mülakat Simülasyonu
        <span class="nav-badge soon">YAKINDA</span>
      </a>
      <a class="nav-item " href="vicareerai-skills.html">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        Beceri Analizi
        <span class="nav-badge new">YENİ</span>
      </a>
      <a class="nav-item " href="vicareerai-roadmap.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
        Kariyer Yol Haritası
        <span class="nav-badge new">YENİ</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <a class="nav-item " href="vicareerai-account.html">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        Hesabım
      </a>
      <a class="logout" href="#">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        Çıkış Yap
      </a>
    </div>
  </aside>

  <main class="main">


<style>
  .letter-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .quota-pill{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--mono-label);
    border:1px dashed var(--cyan-dim);border-radius:var(--radius);padding:9px 14px;display:inline-flex;
    align-items:center;gap:10px;
  }
  .quota-pill .val{color:var(--cyan);font-size:15px;font-weight:600;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mono-label);margin-bottom:9px;}
  .field input, .field textarea, .field select{
    width:100%;height:46px;padding:0 13px;background:rgba(255,255,255,0.02);border:1px solid var(--paper-border);
    border-radius:var(--radius);color:var(--text);font-size:14.5px;
  }
  .field textarea{height:auto;padding:11px 13px;resize:vertical;line-height:1.5;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--cyan);background:rgba(111,214,232,0.04);}
  .field input::placeholder, .field textarea::placeholder{color:rgba(234,243,247,0.25);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .output-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    min-height:340px;color:var(--text-dim);gap:14px;
  }
  .output-empty svg{width:38px;height:38px;color:var(--cyan-dim);}
  .output-empty .o-title{color:var(--text);font-size:15px;font-weight:500;}
  .output-empty .o-sub{font-size:13px;max-width:240px;}
  @media(max-width:900px){.letter-grid{grid-template-columns:1fr;}.field-row{grid-template-columns:1fr;}}
</style>

    <div class="list-head" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:32px;">
      <div class="page-head" style="margin-bottom:0;">
        <div class="peyebrow">MOTİVASYON MEKTUBU</div>
        <h1>GPT-4o ile dakikalar içinde mektup yaz</h1>
        <p>Kişiselleştirilmiş ve ATS uyumlu mektubunu oluştur.</p>
      </div>
      <div class="quota-pill">MEKTUP KOTASI <span class="val">1/3</span></div>
    </div>

    <div class="letter-grid">
      <div class="bp-card">
        <svg class="corners" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M6,15 L6,6 L15,6"/><path d="M85,6 L94,6 L94,15"/><path d="M94,85 L94,94 L85,94"/><path d="M15,94 L6,94 L6,85"/></svg>
        <h3 style="margin-bottom:22px;">Mektup Bilgileri</h3>
        <div class="field"><label>Hedef Pozisyon *</label><input type="text" placeholder="Örn: Senior Frontend Developer"></div>
        <div class="field"><label>Şirket Adı *</label><input type="text" placeholder="Örn: Google Türkiye"></div>
        <div class="field"><label>Sektör (isteğe bağlı)</label><input type="text" placeholder="Örn: Teknoloji, Finans, E-ticaret"></div>
        <div class="field-row">
          <div class="field"><label>Dil</label><select><option>TR Türkçe</option></select></div>
          <div class="field"><label>Ton / Üslup</label><select><option>Profesyonel</option></select></div>
        </div>
        <div class="field"><label>Hakkında Notlar <span style="text-transform:none;color:var(--text-dim);">(AI bu bilgileri kullanır)</span></label>
          <textarea rows="3" placeholder="Örn: 5 yıl React deneyimi, startup çıkışlı, Agile ekiplerde çalıştım..."></textarea>
        </div>
        <button class="btn-stamp" style="width:100%;justify-content:center;">✦ YAPAY ZEKA İLE OLUŞTUR</button>
      </div>

      <div class="bp-card">
        <svg class="corners" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M6,15 L6,6 L15,6"/><path d="M85,6 L94,6 L94,15"/><path d="M94,85 L94,94 L85,94"/><path d="M15,94 L6,94 L6,85"/></svg>
        <h3 style="margin-bottom:22px;">Oluşturulan Mektup</h3>
        <div class="output-empty">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4" fill="none"><path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/></svg>
          <div class="o-title">Mektubun burada görünecek</div>
          <div class="o-sub">Bilgileri doldurup yapay zekayı çalıştır.</div>
        </div>
      </div>
    </div>

  </main>
</div>

</body>
</html>
